<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Stack + Gen AI + Agentic AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* Ambient Light Background Glows */
        .ambient-bg {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
        }

        /* Glassmorphism Light Card */
        .light-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 40px -15px rgba(79, 70, 229, 0.08);
        }

        .cta-button {
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.35);
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #4338ca 0%, #1d4ed8 100%);
            box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.45);
        }
    </style>
</head>
<body class="min-h-full ambient-bg text-slate-800 flex items-center justify-center p-4 sm:p-6">

    <!-- Minimal Single Screen Hero Container -->
    <main class="w-full max-w-md mx-auto my-auto text-center">
        
        <div class="light-card rounded-3xl p-6 sm:p-8 space-y-6">
            
            <!-- Badge -->
            <div class="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse"></span>
                <span>Live Intensive Program</span>
            </div>

            <!-- Title -->
            <h1 class="font-heading text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight leading-snug">
                Full Stack + Gen AI + Agentic AI
            </h1>

            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed font-normal px-2">
                Accelerate your software career with complete mastery in full stack architecture, generative AI models, and autonomous AI agents.
            </p>

            <!-- Prominent Direct Redirect CTA Button -->
            <div class="pt-2">
                <a href="https://forms.gle/rXjp6P9pKb62953m8" target="_blank" rel="noopener noreferrer" class="cta-button w-full py-4 px-6 rounded-2xl text-white font-bold text-sm tracking-wide transition-all transform active:scale-95 flex items-center justify-center space-x-2 no-underline">
                    <span>CLICK HERE TO REGISTER</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>

            <!-- Trust Indicator -->
            <div class="flex items-center justify-center space-x-4 pt-2 text-[11px] text-slate-500 font-medium">
                <span class="flex items-center"><i class="fa-solid fa-bolt text-amber-500 mr-1.5"></i>Instant Access</span>
                <span class="flex items-center"><i class="fa-solid fa-shield-halved text-indigo-500 mr-1.5"></i>100% Free Registration</span>
            </div>

        </div>

    </main>

</body>
</html>
